const OFFSET=0x10000,BLOCK=0x400;
const log=m=>{const e=document.getElementById('log');e.textContent+=m+'\n';e.scrollTop=e.scrollHeight;};
function b64ToBytes(b){const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function le32(v){return[v&0xFF,(v>>8)&0xFF,(v>>16)&0xFF,(v>>24)&0xFF];}
function slipEnc(d){const o=[0xC0];for(const b of d){if(b===0xC0){o.push(0xDB,0xDC);}else if(b===0xDB){o.push(0xDB,0xDD);}else o.push(b);}o.push(0xC0);return new Uint8Array(o);}
function slipDec(d){const o=[];let i=0;while(i<d.length){if(d[i]===0xDB&&i+1<d.length){i++;if(d[i]===0xDC)o.push(0xC0);else if(d[i]===0xDD)o.push(0xDB);}else o.push(d[i]);i++;}return new Uint8Array(o);}
function mkPkt(cmd,data,chk=0){return slipEnc([0x00,cmd,data.length&0xFF,(data.length>>8)&0xFF,...le32(chk),...data]);}
function xorChk(d){let s=0xEF;for(const b of d)s^=b;return s;}
class SlipReader{
  constructor(r){this.r=r.getReader();this.buf=[];}
  async readFrame(ms=3000){
    const f=[];let in_=false;const dl=Date.now()+ms;
    while(Date.now()<dl){
      if(this.buf.length){
        const b=this.buf.shift();
        if(b===0xC0){if(in_&&f.length)return slipDec(new Uint8Array(f));f.length=0;in_=true;}
        else if(in_)f.push(b);
      }else{
        const res=await Promise.race([this.r.read(),new Promise(r=>setTimeout(()=>r({value:null,done:false}),30))]);
        if(res.done)throw new Error('closed');
        if(res.value)for(const b of res.value)this.buf.push(b);
      }
    }
    throw new Error('timeout');
  }
  drain(){this.buf=[];}
  release(){this.r.releaseLock();}
}
async function cmd(w,r,c,data,chk=0,ms=3000,n=3){
  const pkt=mkPkt(c,data,chk);
  for(let i=0;i<n;i++){
    await w.write(pkt);
    try{const res=await r.readFrame(ms);if(res.length>=10&&res[0]===1&&res[1]===c&&res[res.length-2]===0)return res;}
    catch(e){if(i<n-1)log('  retry '+(i+1)+'...');}
  }
  throw new Error('CMD 0x'+c.toString(16)+' failed');
}
document.getElementById('btn').onclick=async()=>{
  const btn=document.getElementById('btn'),bar=document.getElementById('bar');
  btn.disabled=true;bar.style.display='';bar.value=0;
  let port,w,r;
  try{
    if(!('serial' in navigator))throw new Error('WebSerial非対応。ChromeかEdgeで開いてください。');
    port=await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    const fw=b64ToBytes(FW_B64);
    log('Firmware: '+fw.length+' bytes  offset=0x'+OFFSET.toString(16));
    log('Bootloaderにリセット...');
    await port.setSignals({dataTerminalReady:false,requestToSend:true});
    await new Promise(r=>setTimeout(r,100));
    await port.setSignals({dataTerminalReady:true,requestToSend:false});
    await new Promise(r=>setTimeout(r,50));
    await port.setSignals({dataTerminalReady:false});
    await new Promise(r=>setTimeout(r,500));
    w=port.writable.getWriter();r=new SlipReader(port.readable);
    log('Sync中...');
    const sp=[0x07,0x07,0x12,0x20,...Array(32).fill(0x55)];
    let ok=false;
    for(let t=0;t<30&&!ok;t++){await w.write(mkPkt(0x08,sp,0));await new Promise(x=>setTimeout(x,50));try{const res=await r.readFrame(300);if(res.length>=2&&res[1]===8)ok=true;}catch(e){}}
    if(!ok)throw new Error('Sync失敗。配線を確認してください。');
    await new Promise(x=>setTimeout(x,200));
    try{while(true)await r.readFrame(80);}catch(e){}r.drain();
    log('Sync OK!');
    const nb=Math.ceil(fw.length/BLOCK),esz=nb*BLOCK;
    log('消去中... ('+esz+' bytes / '+nb+' blocks)');
    await cmd(w,r,0x02,[...le32(esz),...le32(nb),...le32(BLOCK),...le32(OFFSET)],0,15000);
    log('消去完了。書き込み中...');
    for(let s=0;s<nb;s++){
      const chunk=new Uint8Array(BLOCK).fill(0xFF);
      const len=Math.min(BLOCK,fw.length-s*BLOCK);
      if(len>0)chunk.set(fw.slice(s*BLOCK,s*BLOCK+len));
      await cmd(w,r,0x03,[...le32(BLOCK),...le32(s),...le32(0),...le32(0),...chunk],xorChk(chunk),5000);
      bar.value=Math.round((s+1)*100/nb);
    }
    log('書き込み完了！');
    await cmd(w,r,0x04,[...le32(0)],0,3000);
    log('=== 完了！ESP32が再起動します ===');
  }catch(e){log('ERROR: '+e.message);}
  finally{try{if(r)r.release();}catch(e){}try{if(w)w.releaseLock();}catch(e){}try{if(port)await port.close();}catch(e){}btn.disabled=false;}
};
